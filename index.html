<style id="css">
:root{
  --ground:#F3F6FA; --surface:#FFFFFF; --raise:#E9EFF6;
  --ink:#101A26; --mid:#4E5F75; --faint:#7E90A6; --line:#D6DFEA;
  --accent:#1B3D7A; --accent-soft:#E0E9F8; --ring:#6C8FD0;
  --warn:#A2400F; --warn-soft:#FCE6D6; --warn-line:#E8A878;
  --done:#0F7A52; --done-soft:#DCF3E7; --done-line:#63C69B; --done-deep:#0A5C3E;
  --on-accent:#FFFFFF; --zebra:#FAFBFD; --hover:#EFF3F9;
  --c-talk:#0C6E70; --c-talk-bg:#DDEFEF;
  --c-make:#3A4C99; --c-make-bg:#E3E8F8;
  --c-call:#8A5712; --c-call-bg:#F7EBD7;
  --c-do:#4E5D74;  --c-do-bg:#E8EDF3;
  --q1:#A32320; --q1-bg:#FBE3E2;
  --q2:#1B4E96; --q2-bg:#E1EAF8;
  --q3:#8A4413; --q3-bg:#F9E7D8;
  --q4:#57606E; --q4-bg:#E9ECF1;
  --shadow:0 1px 2px rgba(20,29,41,.06),0 8px 24px -16px rgba(20,29,41,.28);
}

  --ground:#0B1119; --surface:#131C26; --raise:#1A2531;
  --ink:#E8EEF6; --mid:#9DAEC2; --faint:#6E8095; --line:#24303E;
  --accent:#8FB1EA; --accent-soft:#1A2740; --ring:#5A7CBA;
  --warn:#EDA274; --warn-soft:#3A2517; --warn-line:#7A4B26;
  --done:#4FD3A0; --done-soft:#0E2B21; --done-line:#2B7A5C; --done-deep:#6FE0B4;
  --on-accent:#0D131B; --zebra:#111A23; --hover:#1A2531;
  --c-talk:#79CFCF; --c-talk-bg:#14302F;
  --c-make:#A7B8EE; --c-make-bg:#1B2444;
  --c-call:#E6B96F; --c-call-bg:#332715;

:root[data-theme="dark"]{
  --ground:#0B1119; --surface:#131C26; --raise:#1A2531;
  --ink:#E8EEF6; --mid:#9DAEC2; --faint:#6E8095; --line:#24303E;
  --accent:#8FB1EA; --accent-soft:#1A2740; --ring:#5A7CBA;
  --warn:#EDA274; --warn-soft:#3A2517; --warn-line:#7A4B26;
  --done:#4FD3A0; --done-soft:#0E2B21; --done-line:#2B7A5C; --done-deep:#6FE0B4;
  --on-accent:#0D131B; --zebra:#111A23; --hover:#1A2531;
  --c-talk:#79CFCF; --c-talk-bg:#14302F;
  --c-make:#A7B8EE; --c-make-bg:#1B2444;
  --c-call:#E6B96F; --c-call-bg:#332715;
  --c-do:#9FB0C6;  --c-do-bg:#1D2833;
  --q1:#F09B99; --q1-bg:#3A1C1B;

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:400 15px/1.5 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* ---- header ---- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  box-shadow:0 1px 0 var(--line),0 10px 22px -20px rgba(16,26,38,.5);
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
h1{font:700 19px/1.15 Archivo,system-ui,sans-serif;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sub{font:400 12px/1.3 "IBM Plex Mono",ui-monospace,monospace;color:var(--faint);margin-top:3px}
.count{margin-left:auto;display:flex;align-items:center;gap:12px}
.big{font:600 26px/1 Archivo,sans-serif;letter-spacing:-.02em;color:var(--accent)}
.big .dn{color:var(--done);font-size:15px;margin-left:9px}
.big small{font:500 12px/1 "IBM Plex Mono",monospace;color:var(--faint);margin-left:4px}
.meter{width:150px;height:9px;border-radius:99px;background:var(--raise);overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;width:0;transition:width .4s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,var(--done-line),var(--done))}

/* ---- controls ---- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:12px}
input[type=search]{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);color:var(--ink);font:400 14px/1 "IBM Plex Sans",sans-serif}
input[type=search]:focus-visible,button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--mid);cursor:pointer;
  padding:7px 13px;border-radius:99px;font:500 13px/1 "IBM Plex Sans",sans-serif;white-space:nowrap}
.chip:hover{border-color:var(--ring);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);
  color:var(--ink);font:400 13px/1 "IBM Plex Sans",sans-serif;max-width:220px}

/* ---- table ---- */
main{padding-block:6px 0}
.thead{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);z-index:6;
  display:grid;grid-template-columns:30px 158px 1fr 120px 74px 26px;gap:14px;align-items:center;
  padding:9px 14px;background:var(--ground);border-bottom:1.5px solid var(--line);
  font:600 11px/1 Archivo,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:30px 158px 1fr 120px 74px 26px;gap:14px;align-items:start;
  padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line);
  transition:background .12s,opacity .2s}
.row:nth-child(even){background:var(--zebra)}
.row:hover{background:var(--hover)}
.row.newproj{border-top:2px solid var(--line)}
.row.newproj:first-child{border-top:0}
.box{width:24px;height:24px;margin-top:1px;border:2px solid var(--faint);border-radius:7px;
  display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:15px;height:15px;stroke:var(--on-accent);stroke-width:3.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);
  transition:opacity .15s,transform .15s}
.row:hover .box{border-color:var(--accent)}
.row{border-left:3px solid transparent}
.row.on,.row.on:nth-child(even){background:var(--done-soft);border-left-color:var(--done-line)}
.row.on:hover{background:var(--done-soft);filter:brightness(1.02)}
.row.on .box{background:var(--done);border-color:var(--done)}
.row.on .box svg{opacity:1;transform:scale(1)}
.row.on .txt{color:var(--done-deep);text-decoration:line-through;
  text-decoration-color:color-mix(in srgb,var(--done) 55%,transparent);text-decoration-thickness:1.5px}
.row.on .proj{color:var(--done)}
.row.on .kind,.row.on .tag{opacity:.62}
.proj{font:600 12.5px/1.35 Archivo,sans-serif;color:var(--accent);transition:color .15s;letter-spacing:-.005em;
  padding-top:2px;overflow-wrap:anywhere}
.body{min-width:0}
.txt{display:block;line-height:1.42}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center;
  font:400 11px/1 "IBM Plex Mono",ui-monospace,monospace;color:var(--faint)}
.tag{padding:3px 6px;border-radius:5px;background:var(--raise);color:var(--mid)}
.tag.dt{font:600 12px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.02em;
  padding:4px 8px;background:var(--accent-soft);color:var(--accent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent)}
.tag.dt.old{background:var(--warn-soft);color:var(--warn);
  box-shadow:inset 0 0 0 1px var(--warn-line)}
.kind{justify-self:start;padding:5px 9px;border-radius:7px;text-align:center;
  font:500 12px/1.25 "IBM Plex Sans",sans-serif;overflow-wrap:anywhere}
.k-talk{background:var(--c-talk-bg);color:var(--c-talk)}
.k-make{background:var(--c-make-bg);color:var(--c-make)}
.k-call{background:var(--c-call-bg);color:var(--c-call)}
.k-do{background:var(--c-do-bg);color:var(--c-do)}
.del{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:0;margin-top:1px;
  width:24px;height:24px;border-radius:7px;font:400 19px/1 "IBM Plex Sans",sans-serif;
  opacity:0;transition:opacity .12s,background .12s,color .12s}
.row:hover .del,.del:focus-visible{opacity:1}
.del:hover{background:var(--warn-soft);color:var(--warn)}
@media (hover:none){.del{opacity:.5}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:40;
  display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:11px;
  background:var(--ink);color:var(--ground);box-shadow:var(--shadow);
  font:500 13px/1 "IBM Plex Sans",sans-serif;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--ground);cursor:pointer;
  font:600 13px/1 "IBM Plex Sans",sans-serif;text-decoration:underline;padding:0}
.q{justify-self:start;border:1px solid transparent;cursor:pointer;padding:5px 8px;border-radius:7px;
  font:600 11px/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.02em;white-space:nowrap;
  background:var(--raise);color:var(--faint)}
.q:hover{border-color:var(--ring)}
.q[data-q="1"]{background:var(--q1-bg);color:var(--q1)}
.q[data-q="2"]{background:var(--q2-bg);color:var(--q2)}
.q[data-q="3"]{background:var(--q3-bg);color:var(--q3)}
.q[data-q="4"]{background:var(--q4-bg);color:var(--q4)}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:8px 0 12px}
.mxc{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;
  display:flex;flex-direction:column;min-height:170px;margin-bottom:14px}
.mxc h3{margin:0;padding:10px 13px;font:700 13px/1.2 Archivo,sans-serif;
  display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.mxc h3 span{font:400 11px/1 "IBM Plex Mono",monospace;color:var(--faint);letter-spacing:.02em}
.mxc h3 b{margin-left:auto;font:600 12px/1 "IBM Plex Mono",monospace}
.mxc[data-q="1"] h3{background:var(--q1-bg);color:var(--q1)}
.mxc[data-q="2"] h3{background:var(--q2-bg);color:var(--q2)}
.mxc[data-q="3"] h3{background:var(--q3-bg);color:var(--q3)}
.mxc[data-q="4"] h3{background:var(--q4-bg);color:var(--q4)}
.mxc[data-q="0"] h3{background:var(--raise);color:var(--mid)}
.mxl{margin:0;padding:6px;list-style:none;overflow:auto;max-height:340px}
.mxi{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.mxi:hover{background:var(--hover)}
.mxi.on span{text-decoration:line-through;color:var(--done-deep)}
.mxi em{font:600 11px/1.35 Archivo,sans-serif;color:var(--accent);font-style:normal;flex:0 0 108px}
.mxi span{font-size:13px;line-height:1.36}
.mxnone{padding:14px;color:var(--faint);font-size:13px}
@media (max-width:720px){.mx{grid-template-columns:1fr}}
.empty{padding:48px 0;text-align:center;color:var(--faint)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer;
  padding:9px 16px;border-radius:9px;font:600 13px/1 "IBM Plex Sans",sans-serif}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.endbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:20px 14px 40px;
  border-top:2px solid var(--line)}
.save{margin-left:auto;padding:3px 9px;border-radius:99px;background:var(--raise);color:var(--mid);
  opacity:0;transition:opacity .25s}
.save.show{opacity:1}
@media (max-width:720px){
  .thead{display:none}
  .row{grid-template-columns:30px 1fr 26px;gap:12px;row-gap:7px;padding:13px 4px}
  .q{grid-column:2;justify-self:start}
  .proj{grid-column:2;padding-top:0}
  .body{grid-column:2}
  .kind{grid-column:2;justify-self:start}
  .del{grid-column:3;grid-row:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){
  .grp h2{top:calc(env(safe-area-inset-top,0px) + 148px)}
  .big{font-size:22px}
}
</style>

<script id="app">
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var done = JSON.parse(document.getElementById('done').textContent || '{}');
  var prioEl = document.getElementById('prio');
  var prio = JSON.parse((prioEl && prioEl.textContent) || '{}');
  var root = document.getElementById('root');
  var api = null, timer = null, dirty = false, undoBin = null, undoTimer = null;

  var state = {scope:'All', src:'All', proj:'All', q:'', dir:'desc', view:'list'};
  var QUAD = {1:['Do now','urgent + important'], 2:['Plan','important, not urgent'],
              3:['Delegate','urgent, not important'], 4:['Drop','neither']};

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function fmt(d){
    if(!d) return '';
    var p=d.split('-'), m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return p[2].replace(/^0/,'')+' '+m[+p[1]-1];
  }

  var TALK = /^(Call|Email|WhatsApp|Meet|Set meeting|Convene|Present|Brief|Introduce|Interview|Reply|Ask|Mention|Pay)/;
  var MAKE = /^(Draft|Build|Write|Design|Redraft|Update|Finalise|Prepare|Fix|Board|Run model|Run analysis|Research|Run exercise)/;
  var CALL = /^(Decide|Approve|Get approval|Chase approval|Settle|Sign|Hold|Standing|Set strategy|Set scope|Define scope)/;
  function family(k){
    if(CALL.test(k)) return 'k-call';
    if(TALK.test(k)) return 'k-talk';
    if(MAKE.test(k)) return 'k-make';
    return 'k-do';
  }

  function visible(){
    var q = state.q.toLowerCase();
    return DATA.filter(function(it){
      if(state.scope!=='All' && it.scope!==state.scope) return false;
      if(state.src!=='All' && it.s!==state.src) return false;
      if(state.proj!=='All' && it.g!==state.proj) return false;
      if(q && (it.t+' '+it.g+' '+it.o+' '+it.k).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
  }

  // Date order. Newest first by default; the viewer can flip it.
  function ordered(rows){
    var s = state.dir==='asc' ? -1 : 1;
    return rows.slice().sort(function(a,b){
      var da=a.d||'', db=b.d||'';
      if(da!==db) return (db<da?-1:1)*s;
      if(a.g!==b.g) return a.g<b.g?-1:1;
      return a.id<b.id?-1:1;
    });
  }

  function newestLabel(){
    var best='';
    DATA.forEach(function(it){ if(it.d && it.d>best) best=it.d; });
    if(!best) return 'no date';
    var p=best.split('-'), m=['January','February','March','April','May','June','July',
      'August','September','October','November','December'];
    return p[2].replace(/^0/,'')+' '+m[+p[1]-1]+' '+p[0];
  }

  function shell(){
    var projects = {};
    DATA.forEach(function(it){
      if(state.scope==='All' || it.scope===state.scope) projects[it.g]=(projects[it.g]||0)+1;
    });
    var names = Object.keys(projects).sort();
    var opts = '<option value="All">Every project &middot; '+names.length+'</option>' +
      names.map(function(n){return '<option value="'+esc(n)+'"'+(state.proj===n?' selected':'')+'>'+esc(n)+' ('+projects[n]+')</option>';}).join('');
    return ''
    + '<header><div class="hbar">'
    +   '<div><h1>PFAS Action Checklist</h1>'
    +   '<div class="sub">'+DATA.length+' actions &middot; newest '+newestLabel()+'</div></div>'
    +   '<div class="count"><div class="meter"><i id="bar"></i></div>'
    +   '<div class="big" id="tally"></div></div>'
    + '</div>'
    + '<div class="controls">'
    +   '<input type="search" id="q" placeholder="Search '+DATA.length+' actions, people, projects" value="'+esc(state.q)+'">'
    +   ['All','Professional','Personal'].map(function(s){
          return '<button class="chip" data-scope="'+s+'" aria-pressed="'+(state.scope===s)+'">'+s+'</button>';}).join('')
    +   [['list','List'],['matrix','Matrix']].map(function(v){
          return '<button class="chip" data-view="'+v[0]+'" aria-pressed="'+(state.view===v[0])+'">'+v[1]+'</button>';}).join('')
    +   '<select id="src">'
    +     ['All','Diary','Meeting notes','Catch-up','Desk log','Register','Inventory'].map(function(s){
            return '<option value="'+s+'"'+(state.src===s?' selected':'')+'>'+(s==='All'?'Every source':s)+'</option>';}).join('')
    +   '</select>'
    +   '<select id="proj">'+opts+'</select>'
    +   '<select id="dir" title="Date order">'
    +     [['desc','Newest first'],['asc','Oldest first']].map(function(o){
            return '<option value="'+o[0]+'"'+(state.dir===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')
    +   '</select>'
    + '</div></header>'
    + '<main id="list"></main>'
    + '<div class="endbar"><button class="btn" id="xls">Export to Excel</button>'
    +   '<span class="save" id="save">Saved</span></div>'
    + '<div class="toast" id="toast"><span id="toasttxt"></span><button id="undo">Undo</button></div>'
    ;
  }

  function list(){
    var rows = ordered(visible());
    if(!rows.length) return '<div class="empty">Nothing matches that filter.</div>';
    var prev = null;
    var body = rows.map(function(it){
      var old = it.days!=null && it.days>=45;
      var first = it.d !== prev; prev = it.d;
      return '<div class="row'+(done[it.id]?' on':'')+(first?' newproj':'')+'" data-id="'+it.id+'" role="checkbox" tabindex="0" aria-checked="'+!!done[it.id]+'">'
      + '<span class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span>'
      + '<span class="proj">'+esc(it.g)+'</span>'
      + '<div class="body"><span class="txt">'+esc(it.t)+'</span><div class="meta">'
      +   (it.o?'<span class="tag">'+esc(it.o)+'</span>':'')
      +   (it.d?'<span class="tag dt'+(old?' old':'')+'">'+fmt(it.d)+'</span>':'')
      + '</div></div>'
      + '<span class="kind '+family(it.k)+'">'+esc(it.k)+'</span>'
      + qbtn(it.id)
      + '<button class="del" data-del="'+it.id+'" title="Remove this action" aria-label="Remove this action">&times;</button>'
      + '</div>';
    }).join('');
    return '<div class="thead"><span></span><span>Project</span><span>Action item</span><span>Action type</span><span>Priority</span><span></span></div>'
         + '<div class="rows">'+body+'</div>';
  }

  function qbtn(id){
    var q = prio[id] || 0;
    return '<button class="q" data-q="'+q+'" data-qid="'+id+'" title="Click through: do now, plan, delegate, drop">'
      + (q ? esc(QUAD[q][0]) : 'Set') + '</button>';
  }

  function cycle(id){
    var q = (prio[id] || 0) + 1;
    if(q > 4) delete prio[id]; else prio[id] = q;
    paint();
    save();
  }

  function matrix(){
    var rows = ordered(visible());
    var box = {1:[],2:[],3:[],4:[],0:[]};
    rows.forEach(function(it){ box[prio[it.id] || 0].push(it); });
    function cell(q){
      var items = box[q];
      var head = q ? QUAD[q][0] : 'Not sorted yet';
      var sub  = q ? QUAD[q][1] : 'click an item to move it on';
      var body = items.length
        ? '<ul class="mxl">' + items.map(function(it){
            return '<li class="mxi'+(done[it.id]?' on':'')+'" data-qid="'+it.id+'">'
              + '<em>'+esc(it.g)+'</em><span>'+esc(it.t)+'</span></li>';
          }).join('') + '</ul>'
        : '<div class="mxnone">Nothing here.</div>';
      return '<div class="mxc" data-q="'+q+'"><h3>'+esc(head)+' <span>'+esc(sub)+'</span><b>'
        + items.length + '</b></h3>' + body + '</div>';
    }
    return '<div class="mx">'+cell(1)+cell(2)+cell(3)+cell(4)+'</div>'+cell(0);
  }

  function tally(){
    var d=0; DATA.forEach(function(it){ if(done[it.id]) d++; });
    var pct = Math.round(d/DATA.length*100);
    var t=document.getElementById('tally'), b=document.getElementById('bar');
    if(t) t.innerHTML = (DATA.length-d)+'<small>open</small>'
        + (d?'<span class="dn">'+d+' done</span>':'');
    if(b) b.style.width = pct+'%';
  }

  function paint(){ document.getElementById('list').innerHTML = state.view==='matrix' ? matrix() : list(); tally(); }

  function render(){
    root.innerHTML = shell();
    paint();
    document.getElementById('q').addEventListener('input', function(e){
      state.q=e.target.value; paint();
    });
    root.querySelectorAll('[data-view]').forEach(function(b){
      b.addEventListener('click', function(){ state.view=b.dataset.view; render(); });
    });
    root.querySelectorAll('[data-scope]').forEach(function(b){
      b.addEventListener('click', function(){ state.scope=b.dataset.scope; state.proj='All'; render(); });
    });
    document.getElementById('src').addEventListener('change', function(e){ state.src=e.target.value; paint(); });
    document.getElementById('proj').addEventListener('change', function(e){ state.proj=e.target.value; paint(); });
    document.getElementById('dir').addEventListener('change', function(e){ state.dir=e.target.value; paint(); });
    document.getElementById('xls').addEventListener('click', exportXlsx);
    document.getElementById('list').addEventListener('click', function(e){
      var d=e.target.closest('.del');
      if(d){ e.stopPropagation(); removeItem(d.dataset.del); return; }
      var qb=e.target.closest('.q');
      if(qb){ e.stopPropagation(); cycle(qb.dataset.qid); return; }
      var mi=e.target.closest('.mxi');
      if(mi){ cycle(mi.dataset.qid); return; }
      var r=e.target.closest('.row'); if(r) toggle(r);
    });
    document.getElementById('undo').addEventListener('click', undoRemove);
    document.getElementById('list').addEventListener('keydown', function(e){
      if(e.key!==' '&&e.key!=='Enter') return;
      var r=e.target.closest('.row'); if(r){ e.preventDefault(); toggle(r); }
    });
  }

  function toggle(r){
    var id=r.dataset.id;
    if(done[id]) delete done[id]; else done[id]=1;
    r.classList.toggle('on', !!done[id]);
    r.setAttribute('aria-checked', !!done[id]);
    tally();
    save();
  }

  function removeItem(id){
    var i = DATA.findIndex(function(x){return x.id===id;});
    if(i<0) return;
    undoBin = {at:i, item:DATA[i], was:!!done[id]};
    DATA.splice(i,1);
    delete done[id];
    paint();
    var q=document.getElementById('q'); if(q) q.placeholder='Search '+DATA.length+' actions, people, projects';
    showToast('Removed');
    save();
  }

  function undoRemove(){
    if(!undoBin) return;
    DATA.splice(Math.min(undoBin.at, DATA.length), 0, undoBin.item);
    if(undoBin.was) done[undoBin.item.id]=1;
    undoBin = null;
    hideToast();
    paint();
    var q=document.getElementById('q'); if(q) q.placeholder='Search '+DATA.length+' actions, people, projects';
    save();
  }

  function showToast(txt){
    var t=document.getElementById('toast'), s=document.getElementById('toasttxt');
    if(!t) return;
    s.textContent=txt;
    t.classList.add('show');
    clearTimeout(undoTimer);
    undoTimer=setTimeout(function(){ hideToast(); undoBin=null; }, 7000);
  }

  function hideToast(){
    var t=document.getElementById('toast');
    if(t) t.classList.remove('show');
    clearTimeout(undoTimer);
  }

  function flash(txt){
    var s=document.getElementById('save'); if(!s) return;
    s.textContent=txt; s.classList.add('show');
    clearTimeout(s._t); s._t=setTimeout(function(){s.classList.remove('show');},1600);
  }

  function sheetRows(scope){
    var rows = [[scope==='Personal'?'Item':'Project','Action item','Action type','Owner','Raised','Priority','Status']];
    ordered(DATA).forEach(function(it){
      if(it.scope!==scope) return;
      var q = prio[it.id];
      rows.push([it.g, it.t, it.k, it.o, it.d?fmt(it.d)+' 2026':'',
                 q?QUAD[q][0]:'', done[it.id]?'Done':'Open']);
    });
    return rows;
  }

  function exportXlsx(){
    if(typeof XLSX === 'undefined'){ flash('Export unavailable'); return; }
    var stat = {};
    ['Professional','Personal'].forEach(function(sc){
      var d=0, t=0;
      DATA.forEach(function(it){ if(it.scope===sc){ t++; if(done[it.id]) d++; } });
      stat[sc] = {done:d, open:t-d, total:t};
    });

    var sum = [['PFAS ACTION CHECKLIST'],
      ['Exported', new Date().toISOString().slice(0,10)],
      [],
      ['', 'Done', 'Remaining', 'Total'],
      ['Professional', stat.Professional.done, stat.Professional.open, stat.Professional.total],
      ['Personal', stat.Personal.done, stat.Personal.open, stat.Personal.total],
      ['Everything', stat.Professional.done+stat.Personal.done,
                     stat.Professional.open+stat.Personal.open, DATA.length],
      [],
      ['Each sheet lists every item. The Status column says Done or Open.']];

    var wb = XLSX.utils.book_new();
    var ws0 = XLSX.utils.aoa_to_sheet(sum);
    ws0['!cols'] = [{wch:30},{wch:10},{wch:12},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws0, 'Summary');

    ['Professional','Personal'].forEach(function(sc){
      var ws = XLSX.utils.aoa_to_sheet(sheetRows(sc));
      ws['!cols'] = [{wch:26},{wch:92},{wch:16},{wch:22},{wch:12},{wch:11},{wch:10}];
      ws['!freeze'] = {xSplit:0, ySplit:1};
      XLSX.utils.book_append_sheet(wb, ws, sc);
    });

    var buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    var blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var name = 'PFAS_Action_Checklist_' + new Date().toISOString().slice(0,10) + '.xlsx';
    if(!window.claude || !window.claude.use){
      try{
        var u = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = u; link.download = name;
        document.body.appendChild(link); link.click();
        setTimeout(function(){ URL.revokeObjectURL(u); link.remove(); }, 0);
        flash('Exported');
      }catch(e){ flash('Export failed'); }
      return;
    }
    window.claude.use('downloads').then(function(dl){
      if(!dl){ flash('Export unavailable'); return; }
      return dl.save({filename:name, data:blob}).then(function(){ flash('Exported'); });
    }).catch(function(err){
      if(err && err.code==='declined') return;
      flash('Export failed');
    });
  }

  var STANDALONE = false;
  function localSave(){
    try{
      localStorage.setItem('pfas-checklist-done', JSON.stringify(done));
      localStorage.setItem('pfas-checklist-prio', JSON.stringify(prio));
      flash('Saved on this device');
    }catch(e){ flash('Not saved'); }
  }
  function localLoad(){
    try{
      var rd = localStorage.getItem('pfas-checklist-done');
      if(rd) done = JSON.parse(rd) || done;
      var rp = localStorage.getItem('pfas-checklist-prio');
      if(rp) prio = JSON.parse(rp) || prio;
    }catch(e){}
  }

  function flushSave(){
    clearTimeout(timer);
    if(STANDALONE){ dirty = false; localSave(); return; }
    if(!api || !dirty){ flash(api ? 'Saved' : 'Not connected'); return; }
    dirty = false;
    api.publish(buildDoc()).then(function(){ flash('Saved'); })
      .catch(function(err){
        if(err && (err.code==='not_granted' || err.code==='not_writer')) flash('View only');
        else if(!err || err.code!=='conflict') flash('Not saved');
      });
  }

  function buildDoc(){
    var css = document.getElementById('css').textContent;
    var app = document.getElementById('app').textContent;
    var FONTLINK = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">';
    var SJS = '<scr' + 'ipt src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></scr' + 'ipt>';
    var font = FONTLINK + '\n' + SJS;
    var S = '<scr'+'ipt', E = '</scr'+'ipt>';
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
      + '<title>PFAS Action Checklist</title>\n' + font + '\n'
      + '<style id="css">' + css + '</style>\n'
      + '</head>\n<body style="margin:0">\n<div id="root" class="wrap"></div>\n'
      + S + ' id="data" type="application/json">' + JSON.stringify(DATA) + E + '\n'
      + S + ' id="prio" type="application/json">' + JSON.stringify(prio) + E + '\n'
      + S + ' id="done" type="application/json">' + JSON.stringify(done) + E + '\n'
      + S + ' id="app">' + app + E + '\n</body>\n</html>';
  }

  function save(){
    dirty = true;
    clearTimeout(timer);
    timer = setTimeout(flushSave, 900);
  }

  STANDALONE = !(window.claude && window.claude.use);
  if(STANDALONE) localLoad();

  render();

  if(window.claude && window.claude.use){
    window.claude.use('artifact').then(function(a){ api = a; }).catch(function(){});
  }
})();
</script>
</body>
</html>
